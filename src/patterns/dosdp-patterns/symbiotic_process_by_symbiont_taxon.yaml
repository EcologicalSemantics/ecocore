pattern_name: symbiotic_process_by_symbiont_taxon
pattern_iri: http://purl.obolibrary.org/obo/ecocore/patterns/symbiotic_process_by_symbiont_taxon.yaml
description: >
  A symbiotic process defined by the taxon that acts as symbiont.
  Use this pattern when adding a named symbiosis (e.g. mycorrhizal symbiosis,
  nitrogen-fixing symbiosis) that is characterized by a specific symbiont taxon.
  The defined class is equivalent to: symbiosis AND (has_participant some symbiont_taxon).

contributors:
  - https://orcid.org/0000-0002-2908-3327

classes:
  symbiosis: ECOCORE:00000022
  taxon: NCBITaxon:1

relations:
  has_participant: RO:0000057

annotationProperties:
  exact_synonym: oio:hasExactSynonym
  definition_source: IAO:0000119
  term_editor: IAO:0000117

vars:
  symbiont_taxon: "'taxon'"

name:
  text: "%s symbiosis"
  vars:
    - symbiont_taxon

def:
  text: "A symbiotic process in which one participant is a member of %s."
  vars:
    - symbiont_taxon

subClassOf:
  text: "'symbiosis'"

equivalentTo:
  text: "'symbiosis' and ('has_participant' some %s)"
  vars:
    - symbiont_taxon
