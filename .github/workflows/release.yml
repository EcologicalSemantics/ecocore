# EcoCore release workflow
# Triggered by a date-stamped version tag: vYYYY-MM-DD
#
# Release process:
#   1. Run `make prepare_release IMP=false` locally (or via run.sh)
#   2. Commit and push the updated release files to master
#   3. Push the version tag: git tag vYYYY-MM-DD && git push origin vYYYY-MM-DD
#   4. This workflow fires automatically and publishes the GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'

jobs:
  # -----------------------------------------------------------------------
  # Job 1: build release artifacts inside the ODK container
  # -----------------------------------------------------------------------
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6.1

    steps:
      - uses: actions/checkout@v4

      - name: Run QC checks
        run: cd src/ontology && make ROBOT_ENV='ROBOT_JAVA_ARGS=-Xmx6G' test IMP=false PAT=false MIR=false

      - name: Build release artifacts
        run: cd src/ontology && make ROBOT_ENV='ROBOT_JAVA_ARGS=-Xmx6G' prepare_release IMP=false PAT=false MIR=false

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            ecocore.owl
            ecocore.obo
            ecocore.json
            ecocore-full.owl
            ecocore-full.obo
            ecocore-full.json
            ecocore-base.owl
            ecocore-base.obo
            ecocore-base.json
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Job 2: publish the GitHub Release (runs on runner host, not in container)
  # -----------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## EcoCore ${{ github.ref_name }}

            | File | Description |
            |------|-------------|
            | `ecocore.owl` | Full release ontology (all imports merged in) |
            | `ecocore-base.owl` | Base ontology (no external imports merged) |
            | `ecocore-full.owl` | Full ontology with all components |
            | `ecocore.obo`, `ecocore.json` | Alternative formats |

            See [CHANGELOG.md](https://github.com/EcologicalSemantics/ecocore/blob/master/CHANGELOG.md) for a summary of changes.
          files: release-files/*
